<div class="pv" id="pv">
<div class="pv-row">
<figure><img id="pvImg" alt="档位样张"><figcaption id="pvL1">—</figcaption></figure>
<figure><img id="pvImg2" alt="常规体型样张"><figcaption id="pvL2">—</figcaption></figure>
</div>
<div class="cap"><b id="pvName"></b><span id="pvMeta"></span></div>
</div>
<div class="optTip" id="optTip" aria-hidden="true"></div>
<div class="psv" id="psv" aria-hidden="true">
  <div class="psv-box">
    <div class="psv-h"><b>是否保存本次设定</b><i id="psvX" title="关闭">✕</i></div>
    <p class="psv-sub">保存后可在预设栏一键复用整套参数</p>
    <input class="psv-in" id="psvName" type="text" placeholder="预设名称"/>
    <p class="psv-tip" id="psvTip"></p>
    <div class="psv-act">
      <button type="button" id="psvSkip">这次不保存</button>
      <button type="button" class="ok" id="psvSave">保存预设</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="lb" id="lb" aria-hidden="true">
  <button class="lb-x" id="lbX" type="button" aria-label="关闭">✕</button>
  <div class="lb-inner" id="lbInner">
    <div class="lb-head"><b id="lbTitle">—</b><span id="lbSub"></span></div>
    <div class="lb-row">
      <figure class="lb-cell"><img id="lbA" alt="大码样张"><figcaption id="lbLA"></figcaption></figure>
      <figure class="lb-cell"><img id="lbB" alt="常规体型样张"><figcaption id="lbLB"></figcaption></figure>
    </div>
    <div class="lb-tip">点击图片放大 / 还原 · 点击空白处或按 Esc 关闭</div>
  </div>
</div>
