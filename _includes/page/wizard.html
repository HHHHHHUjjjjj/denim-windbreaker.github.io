<div class="dgwiz" id="dgWiz" aria-hidden="true">
  <div class="dgwiz-mask" data-wiz="close"></div>
  <div class="dgwiz-box" role="dialog" aria-modal="true" aria-labelledby="dgWizTitle">
    <div class="dgwiz-head">
      <div>
        <div class="dgwiz-kicker" id="dgWizKicker">第 1 / 4 步</div>
        <h3 id="dgWizTitle">商品与任务</h3>
      </div>
      <button type="button" class="dgwiz-x" data-wiz="close" aria-label="关闭">✕</button>
    </div>
    <div class="dgwiz-steps" id="dgWizSteps"></div>
    <div class="dgwiz-body" id="dgWizBody"></div>
    <div class="dgwiz-foot">
      <div class="dgwiz-hint" id="dgWizHint"></div>
      <div class="dgwiz-btns">
        <button type="button" class="dgwiz-b" data-wiz="prev">上一步</button>
        <button type="button" class="dgwiz-b primary" data-wiz="next" id="dgWizNext">下一步</button>
      </div>
    </div>
  </div>
</div>

</div>

</div>
